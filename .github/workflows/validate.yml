name: Validate R Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required packages
        run: |
          Rscript --vanilla -e 'install.packages(c("readr", "readxl", "dplyr", "purrr", "yaml", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Run smoke test
        run: |
          Rscript --vanilla scripts/test.R

      - name: Run documentation and validation pipeline
        run: |
          Rscript --vanilla scripts/run.R