name: Validate R Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required packages
        run: |
          Rscript -e 'install.packages(c("tidyverse", "readxl", "yaml", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Run smoke test
        run: |
          Rscript scripts/test.R

      - name: Run documentation and validation pipeline
        run: |
          Rscript scripts/run.R