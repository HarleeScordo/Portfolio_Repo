name: Validate R Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("readr", "readxl", "dplyr", "purrr", "yaml", "stringr", "tidyr", "knitr"), repos = "https://cloud.r-project.org")'

      - name: Run smoke test
        run: |
          Rscript scripts/test.R

      - name: Run documentation and validation pipeline
        run: |
          Rscript scripts/run.R