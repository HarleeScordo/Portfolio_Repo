name: Validate Data Intake Framework

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Run smoke test
        run: Rscript scripts/test.R

      - name: Run documentation and validation pipeline
        run: Rscript scripts/run.R
